plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opentripper'
    compileSdk 34

    defaultConfig {
        applicationId "com.opentripper"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.5.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/opentripper-release.jks")
            storePassword "opentripper123"
            keyAlias "opentripper"
            keyPassword "opentripper123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero dependências externas pesadas - Android puro para velocidade máxima
}
