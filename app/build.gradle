plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opentripper'
    compileSdk 34

    defaultConfig {
        applicationId "com.opentripper"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero dependências externas pesadas - Android puro para velocidade máxima
}
