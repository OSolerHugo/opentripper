name: Build OpenTripper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk opentripper-v0.5.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk opentripper.apk
          ls -la opentripper*.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentripper-apk
          path: opentripper.apk

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.5.3 --yes || true
          cat << 'EOF' > release_notes.md
          ### Novidades do OpenTripper v0.5.3:
          - 🛠️ **Correção Crítica no Parser do Maps e Waze:** Removido o filtro rígido que descartava notificações válidas contendo mensagens de status do sistema ("GPS conectado" do Google Maps ou "em segundo plano" do Waze).
          - 🔄 **Reconexão Automática do Leitor de Notificações:** Mecanismo ativo com `requestRebind()` e reset de componente para resolver o bug clássico do Android que desvincula o `NotificationListenerService` silenciosamente após atualização de APK.
          - 🔓 **Suporte a Configurações Restritas (Android 13, 14 e 15):** Botão de atalho para liberar configurações restritas em APKs instalados fora da Play Store.
          - 🧪 **Botão de Teste e Simulação de Manobras:** Permite testar manobras (500m curva à direita, rotatória 2ª saída, curva acentuada 35m com anel de LED e bandeira de chegada) no painel da moto diretamente na garagem sem precisar rodar.
          - ⏱️ **Estabilidade de Rota (Timeout de 2 minutos):** As manobras agora permanecem firmes na tela mesmo durante semáforos vermelhos e longos trechos retos sem novas notificações.
          - 📋 **Diagnóstico e Logs em Tempo Real:** Status visual de conexão com o Android e log ao vivo de notificações recebidas na aba Navegação.
          - 🔗 **Download Direto:** `https://github.com/OSolerHugo/opentripper/releases/latest/download/opentripper.apk`
          EOF
          gh release create v0.5.3 opentripper-v0.5.3.apk opentripper.apk \
            --title "OpenTripper v0.5.3 - Turn-by-Turn Interceptor & Rebind Fix" \
            --notes-file release_notes.md
