name: Build OpenTripper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk opentripper-v0.3.0.apk
          ls -la opentripper-v0.3.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentripper-apk
          path: opentripper-v0.3.0.apk

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.3.0 --yes || true
          gh release create v0.3.0 opentripper-v0.3.0.apk \
            --title "OpenTripper v0.3.0 (APK Nativo)" \
            --notes "Primeiro APK nativo do OpenTripper para Hunter 350. Inclui GATT Server local para canal de retorno exigido pelo Tripper Pod, keepalive contínuo de telas, ajuste de relógio e manobras."
