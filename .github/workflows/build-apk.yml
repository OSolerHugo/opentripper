name: Build OpenTripper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk opentripper-v0.3.1.apk
          ls -la opentripper-v0.3.1.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentripper-apk
          path: opentripper-v0.3.1.apk

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.3.1 --yes || true
          gh release create v0.3.1 opentripper-v0.3.1.apk \
            --title "OpenTripper v0.3.1 - Explorador de Ícones & Logs Persistentes" \
            --notes "Novidades da versão v0.3.1:
- 🧭 **Explorador / Fuzzer de Ícones:** Permite navegar e testar códigos de ícones de 0x00 a 0xFF no visor do Tripper Pod, com pulo rápido para faixas desconhecidas e botão de anotação de descobertas.
- 💾 **Logs Persistentes no Disco:** O histórico de comunicação e eventos agora é gravado em arquivo local interno (opentripper_logs.txt), sobrevivendo ao fechar e reabrir o app.
- 📤 **Compartilhamento e Limpeza de Logs:** Botões para enviar logs diretamente via WhatsApp/Email e limpar histórico.
- 🛡️ **Watchdog Otimizado:** Mantém o painel acordado enviando continuamente a manobra selecionada no explorador."
