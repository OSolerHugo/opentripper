name: Build OpenTripper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk opentripper-v0.5.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk opentripper.apk
          ls -la opentripper*.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentripper-apk
          path: opentripper.apk

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.5.4 --yes || true
          cat << 'EOF' > release_notes.md
          ### Novidades do OpenTripper v0.5.4:
          - ⚡ **Zero Travamentos & Fim do Alerta de Cache:** Desativada completamente a escrita contínua de logs em disco e o reprocessamento pesado na interface. O app agora roda leve e fluido com celular no bolso.
          - 📄 **Logs Sob Demanda:** Logs agora são gerados apenas se você tocar no botão "📄 Gerar Relatório de Logs", com buffer em memória limitado a 30 eventos.
          - 🧹 **Remoção do Explorador de Ícones:** Tela de Dispositivo limpa e simplificada, focada apenas na conexão, sincronização e configurações úteis.
          - 🗺️ **Google Maps 100% Funcional:** Navegação curva a curva nativa testada e aprovada no painel da Royal Enfield Hunter 350.
          - 🔗 **Download Direto:** `https://github.com/OSolerHugo/opentripper/releases/latest/download/opentripper.apk`
          EOF
          gh release create v0.5.4 opentripper-v0.5.4.apk opentripper.apk \
            --title "OpenTripper v0.5.4 - Performance Optimization & UI Cleanup" \
            --notes-file release_notes.md
