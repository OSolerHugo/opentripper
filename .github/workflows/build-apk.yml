name: Build OpenTripper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk opentripper-v0.5.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk opentripper.apk
          ls -la opentripper*.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentripper-apk
          path: opentripper.apk

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.5.1 --yes || true
          cat << 'EOF' > release_notes.md
          ### Novidades do OpenTripper v0.5.1:
          - 🔑 **Validação Automática de PIN:** Caixa de digitação de PIN no topo da tela quando o Tripper Pod solicita pareamento na primeira conexão.
          - 🗑️ **Botão Esquecer Dispositivo:** Opção na aba Dispositivo para redefinir o pareamento quando quiser forçar um novo PIN.
          - 🎨 **Identidade Visual Completa:** Navegação em 4 abas, mostrador circular automotivo e tema grafite (#0A0E17).
          - 🔗 **Link Permanente:** `https://github.com/OSolerHugo/opentripper/releases/latest/download/opentripper.apk`
          EOF
          gh release create v0.5.1 opentripper-v0.5.1.apk opentripper.apk \
            --title "OpenTripper v0.5.1 - PIN Validation & Forget Device" \
            --notes-file release_notes.md
