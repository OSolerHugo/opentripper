name: Build OpenTripper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk opentripper-v0.3.1.apk
          ls -la opentripper-v0.3.1.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentripper-apk
          path: opentripper-v0.3.1.apk

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.3.1 --yes || true
          cat << 'EOF' > release_notes.md
          ### Novidades do OpenTripper v0.3.1:
          - 🧭 **Explorador / Fuzzer de Ícones:** Teste códigos de 0x00 a 0xFF diretamente no visor do Tripper Pod com botões de avanço, recuo e pulo para faixas ocultas.
          - 💾 **Logs Persistentes em Disco:** Histórico completo de eventos salvo em opentripper_logs.txt, sem perder dados ao fechar o app.
          - 📤 **Compartilhar e Limpar Logs:** Envio rápido de logs via WhatsApp/Email e limpeza de histórico.
          - 📝 **Anotador de Descobertas:** Registre no log o que apareceu no painel em tempo real.
          - 🛡️ **Watchdog Contínuo:** Mantém o painel ligado reenviando a manobra ativa a cada 1.5s.
          EOF
          gh release create v0.3.1 opentripper-v0.3.1.apk \
            --title "OpenTripper v0.3.1 - Explorador de Ícones & Logs Persistentes" \
            --notes-file release_notes.md
