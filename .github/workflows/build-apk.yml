name: Build OpenTripper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk opentripper-v0.4.0.apk
          ls -la opentripper-v0.4.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentripper-apk
          path: opentripper-v0.4.0.apk

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.4.0 --yes || true
          cat << 'EOF' > release_notes.md
          ### Novidades do OpenTripper v0.4.0 (Modo Híbrido: Navegação & Velocímetro):
          - 🏍️ **Modo Híbrido Inteligente:** Se o Waze ou Google Maps estiver navegando, projeta as curvas, rotatórias e distâncias. Se não houver rota, o visor vira um **Velocímetro Digital de alta precisão em tempo real**!
          - 🔄 **Suporte Completo a Rotatórias (1ª a 9ª Saída):** Graças à descoberta na Hunter 350 (`0x0B..0x13`), qualquer rotatória no Maps/Waze exibe a saída correta no painel.
          - 🔋 **Zero Desperdício de Bateria:** O chip GPS do celular só liga quando a moto conecta e desliga no milissegundo em que você desliga a ignição.
          - 🪞 **Espelho em Tempo Real no App:** Veja na tela do celular exatamente o que está desenhado no painel da moto.
          - ⚡ **Auto-Conectar ao Ligar a Moto:** Habilite o interruptor para subir na moto e rodar sem nem tirar o celular do bolso.
          - 🧭 **Modo Bússola Alternativo:** Escolha entre Velocímetro ou Bússola 360° para o modo cruzeiro.
          - 🛠️ **Área de Ferramentas Retrátil:** Explorador de ícones e logs guardados discretamente para deixar a tela principal limpa e bonita.
          EOF
          gh release create v0.4.0 opentripper-v0.4.0.apk \
            --title "OpenTripper v0.4.0 - Modo Híbrido (Navegação & Velocímetro)" \
            --notes-file release_notes.md
