name: Build OpenTripper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk opentripper-v0.5.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk opentripper.apk
          ls -la opentripper*.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentripper-apk
          path: opentripper.apk

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.5.0 --yes || true
          cat << 'EOF' > release_notes.md
          ### Novidades do OpenTripper v0.5.0 (Identidade Visual Industrial & 4 Abas):
          - 🎨 **Design Automotivo Industrial:** Nova interface profissional com paleta grafite (#0A0E17), superfícies escuras (#141C28) e acentos Cyan (#00C2D9) e Verde (#22C785).
          - 🧭 **Navegação em 4 Abas:** Dashboard (mostrador em espelho), Navegação (Waze/Maps), Cruzeiro (Velocímetro e Bússola) e Dispositivo (conexão e diagnóstico).
          - 🔑 **Assinatura Fixa Definitiva:** O APK agora é assinado com uma chave de release oficial própria. Atualizações futuras instalam por cima sem conflito de assinatura!
          - 🔗 **Link de Download Permanente:** O link `https://github.com/OSolerHugo/opentripper/releases/latest/download/opentripper.apk` sempre baixa a versão mais recente.
          - 🏍️ **Novo Ícone Oficial:** Ícone do velocímetro O_T incorporado ao aplicativo.
          EOF
          gh release create v0.5.0 opentripper-v0.5.0.apk opentripper.apk \
            --title "OpenTripper v0.5.0 - Automotive Instrumentation & 4 Tabs" \
            --notes-file release_notes.md
